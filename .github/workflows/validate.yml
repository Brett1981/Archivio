name: Validate

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Archivio.sln --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format Archivio.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build Archivio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Archivio.sln --configuration Release --no-build --logger "console;verbosity=minimal"
